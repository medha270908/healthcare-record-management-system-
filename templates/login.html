{% extends "base.html" %}
{% block title %}Doctor Login{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">🛡️</div>
            <h2>HealthChain Portal</h2>
            <p>Doctor &amp; Authorized Personnel Login</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="doctor1" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 22px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; font-size: 15px;">
                🔐 Secure Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
